<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/logo.png?v=connect" />
  <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico?v=connect" />
  <link rel="apple-touch-icon" href="/logo.png?v=connect" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" id="app-theme-color" content="#0A24AC" />

  <!-- ── Critical preconnects: DNS + TLS handshake before JS runs ── -->
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Cloudinary CDN (product images load instantly) -->
  <link rel="preconnect" href="https://res.cloudinary.com" crossorigin>

  <!-- Razorpay payment SDK (checkout) -->
  <link rel="preconnect" href="https://api.razorpay.com" crossorigin>
  <link rel="dns-prefetch" href="https://checkout.razorpay.com">

  <!-- Firebase FCM (push notifications) -->
  <link rel="dns-prefetch" href="https://fcm.googleapis.com">
  <link rel="dns-prefetch" href="https://firebaseinstallations.googleapis.com">

  <!-- Google Maps (geocoding/serviceability) -->
  <link rel="dns-prefetch" href="https://maps.googleapis.com">

  <!-- ── Google Fonts: display=swap prevents invisible text (FOIT) ── -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">

  <title>Anushka Connect - Quick Commerce & E-Commerce</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
