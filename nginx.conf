# ╔══════════════════════════════════════════════════════════════════════╗
# ║   AnushkaKart — Nginx Production Config                              ║
# ║   Target: Hostinger KVM 4 VPS (4 vCPU / 8 GB RAM)                   ║
# ║                                                                      ║
# ║   Setup:                                                             ║
# ║     sudo cp nginx.conf /etc/nginx/sites-available/anushkakart        ║
# ║     sudo ln -s /etc/nginx/sites-available/anushkakart \              ║
# ║               /etc/nginx/sites-enabled/anushkakart                  ║
# ║     sudo nginx -t && sudo systemctl reload nginx                     ║
# ╚══════════════════════════════════════════════════════════════════════╝

# ── Upstream: PM2 cluster (3 workers on port 7000) ────────────────────────
upstream anushkakart_api {
    # least_conn prevents one worker from getting all long-running requests
    least_conn;

    server 127.0.0.1:7000;       # PM2 manages load-balancing internally
    keepalive 32;                 # Keep 32 idle connections to the backend
}

# ── Rate limiting zones (defined in http context via nginx.conf include) ──
# Uncomment these if you add them to /etc/nginx/nginx.conf http{} block:
# limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
# limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name anushkakart.in www.anushkakart.in;

    # Allow Let's Encrypt ACME challenges (Certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Main HTTPS server ─────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name anushkakart.in www.anushkakart.in;

    # ── TLS (Let's Encrypt via Certbot) ──────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/anushkakart.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anushkakart.in/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Modern TLS: TLS 1.2 + 1.3 only
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ── Security Headers ──────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

    # ── Gzip / Brotli Compression ─────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff
        font/woff2
        application/font-woff
        application/font-woff2;

    # ── Root: Serve React SPA (built by `npm run build`) ──────────────────
    root /var/www/anushkakart/frontend/dist;
    index index.html;

    # ── Static assets: long-lived cache (Vite adds content hashes) ────────
    location ~* \.(js|css|woff2?|ttf|eot|ico|png|jpg|jpeg|gif|webp|svg|avif)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Vary "Accept-Encoding";
        access_log off;
        try_files $uri =404;
    }

    # ── Service Worker (must be no-cache so it updates immediately) ───────
    location ~* (service-worker\.js|firebase-messaging-sw\.js)$ {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        try_files $uri =404;
    }

    # ── Manifest and HTML (short cache) ───────────────────────────────────
    location ~* \.(html|webmanifest)$ {
        expires 5m;
        add_header Cache-Control "public, max-age=300, must-revalidate";
        try_files $uri /index.html;
    }

    # ── API: Proxy to Node.js backend ─────────────────────────────────────
    location /api/ {
        proxy_pass         http://anushkakart_api;
        proxy_http_version 1.1;

        # WebSocket / keep-alive support
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Pass real client IP for rate limiting and logging
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts: allow slow order/payment endpoints
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Buffer settings for JSON API responses
        proxy_buffering       on;
        proxy_buffer_size     16k;
        proxy_buffers         8 32k;
        proxy_busy_buffers_size 64k;

        # No client-side cache for API responses (backend sets its own headers)
        add_header Cache-Control "no-store" always;

        # Hide upstream headers that could leak server info
        proxy_hide_header X-Powered-By;
    }

    # ── Socket.IO (real-time order tracking) ─────────────────────────────
    location /socket.io/ {
        proxy_pass         http://anushkakart_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;

        # Socket.IO needs longer timeouts
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # ── Uploads (local media, if Cloudinary is not used) ─────────────────
    location /uploads/ {
        alias /var/www/anushkakart/backend/public/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
    }

    # ── React Router: fallback for all non-file paths ─────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        expires 5m;
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }

    # ── Block common attack paths ─────────────────────────────────────────
    location ~* \.(env|git|htaccess|htpasswd|ini|log|sh|sql|swp|bak)$ {
        deny all;
        return 404;
    }

    # ── Logging ───────────────────────────────────────────────────────────
    access_log /var/log/nginx/anushkakart-access.log combined buffer=64k flush=5s;
    error_log  /var/log/nginx/anushkakart-error.log warn;

    # ── Limits ────────────────────────────────────────────────────────────
    client_max_body_size 15m;     # Allow 15MB uploads (product images)
    client_body_timeout  30s;
    client_header_timeout 10s;
    keepalive_timeout    65s;
    send_timeout         30s;
}
