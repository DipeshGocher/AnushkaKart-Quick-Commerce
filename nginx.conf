# AnushkaKart - nginx config for the LIVE server (anushkaconnect.com).
# Installed at /etc/nginx/sites-available/anushka-store (symlinked from sites-enabled).
# The lines marked "managed by Certbot" must stay as they are, Certbot renews the certificate through them.
#
# Install (on the server):
#   sudo cp /etc/nginx/sites-available/anushka-store ~/nginx.backup.conf     # backup first
#   ... replace the file with this one ...
#   sudo nginx -t && sudo systemctl reload nginx                              # only reload if the test passes
# Roll back:  sudo cp ~/nginx.backup.conf /etc/nginx/sites-available/anushka-store && sudo systemctl reload nginx

server {
    server_name anushkaconnect.com www.anushkaconnect.com;

    root /var/www/anushka-store;
    index index.html;

    server_tokens off;
    client_max_body_size 25m;

    # ── Compression ───────────────────────────────────────────────────────
    # nginx compresses only text/html unless told otherwise, so JS/CSS/JSON went out uncompressed.
    # `npm run build:web` (used by deploy.sh) also writes ready-made .gz files; gzip_static serves those.
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        image/x-icon;

    # ── Service worker: never cache ───────────────────────────────────────
    # Must stay ABOVE the static-file rule below (nginx takes the first matching regex).
    location ~* (service-worker\.js|firebase-messaging-sw\.js)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # ── Build output (/assets): file names contain a hash, so cache for a year ──
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # ── Files from public/ (logo.png, favicon.ico, banners): same name when they change ──
    # So NOT immutable: one day, then the browser may show the old one for up to a week
    # while it re-checks in the background.
    location ~* \.(js|css|woff2?|ttf|eot|ico|png|jpg|jpeg|gif|webp|svg|avif|json)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # ── index.html: always re-check ───────────────────────────────────────
    # It points at the hashed files. If browsers keep an old copy after a deploy, people
    # keep seeing the old app. "no-cache" = ask every time, the answer is a tiny 304.
    location ~* \.(html|webmanifest)$ {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ^~ so that an API address ending in .json/.png is never taken by the file rules above.
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:7000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ^~ /socket.io/ {
        proxy_pass http://127.0.0.1:7000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/anushkaconnect.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/anushkaconnect.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = anushkaconnect.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name anushkaconnect.com www.anushkaconnect.com;
    return 404; # managed by Certbot


}
